[project]
name = "flywire-propagation-sim"
version = "0.1.0"
description = "Signal propagation simulator over a real subgraph of the FlyWire Drosophila connectome"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "networkx>=3.0",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
build-subgraph = "flywire_data.build_subgraph:main"
flywire-sim = "flywire_sim.run:main"
flywire-api = "flywire_api.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flywire_data", "src/flywire_sim", "src/flywire_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient tells us to switch to httpx2. Nothing we can act on
    # from here, and the noise makes a clean run look like a failing one.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning",
]
